<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 320px; font-family: system-ui, sans-serif; padding: 14px; color: #0f172a; }
    h2 { font-size: 16px; margin: 0 0 8px; color: #0043ce; }
    label { display: block; font-size: 12px; font-weight: 600; margin-top: 8px; }
    input { width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; font-size: 12px; }
    button { width: 100%; margin-top: 10px; padding: 8px; border: none; border-radius: 6px; background: #0f62fe; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #e2e8f0; color: #0f172a; }
    #status { font-size: 12px; margin-top: 8px; color: #475569; }
  </style>
</head>
<body>
  <h2>Jobby Bot</h2>
  <label>Full Name</label>
  <input id="full_name" placeholder="Aarav Sharma" />
  <label>Email</label>
  <input id="email" type="email" placeholder="you@example.com" />
  <label>Phone (+91)</label>
  <input id="phone" placeholder="+91 9876543210" />
  <label>Notice Period (Days)</label>
  <input id="notice_days" value="30" />
  <label>Current / Expected CTC (LPA)</label>
  <input id="expected_ctc" placeholder="18 LPA" />
  <button id="save-btn" class="secondary">Save Local Profile</button>
  <button id="fill-btn">Auto-Fill &amp; Apply Current Tab</button>
  <div id="status">Ready.</div>
  <script src="popup.js"></script>
</body>
</html>
